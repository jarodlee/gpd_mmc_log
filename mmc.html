<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPD Pocket Monitor</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
    margin: 0;
    background: #f3f6fa;
    color: #333;
}

.header {
    padding: 20px 30px;
    background: #1e293b;
    color: #fff;
}

.header h2 {
    margin: 0;
    font-weight: 500;
}

.status {
    margin-top: 10px;
    font-size: 13px;
    color: #cbd5e1;
}

.container {
    padding: 25px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 18px;
}

.card {
    background: #ffffff;
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    transition: 0.2s ease;
}

.card:hover {
    transform: translateY(-3px);
}

.label {
    font-size: 14px;
    color: #666;
}

.value {
    font-size: 22px;
    font-weight: 600;
    margin-top: 6px;
    overflow-wrap: anywhere;
}

.ok { color: #16a34a; }
.warn { color: #f59e0b; }
.danger { color: #dc2626; }
.muted { color: #64748b; }

.chart-wrap {
    margin: 20px 25px;
    height: 320px;
}

canvas {
    background: #fff;
    border-radius: 14px;
    padding: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    width: 100%;
    height: 100%;
}

.footer {
    text-align: center;
    padding: 15px;
    font-size: 13px;
    color: #888;
}
</style>
</head>

<body>

<div class="header">
<h2>GPD eMMC Hardware Professional Monitor</h2>
<div style="font-size:13px;color:#94a3b8;">
温度 > 60°C / ARC > 3GB / 内存 > 80% / 今日写入 > 30GB 需注意
</div>
<div class="status" id="status">正在加载...</div>
</div>

<div class="container">

<div class="card">
<div class="label">eMMC 设备</div>
<div class="value" id="disk_info"></div>
</div>

<div class="card">
<div class="label">累计写入</div>
<div class="value" id="total_tb"></div>
</div>

<div class="card" id="today_card">
<div class="label">今日写入</div>
<div class="value" id="today_gb"></div>
</div>

<div class="card">
<div class="label">平均每日写入</div>
<div class="value" id="avg_daily_gb"></div>
</div>

<div class="card">
<div class="label">eMMC估算使用率</div>
<div class="value" id="life_percent"></div>
</div>

<div class="card">
<div class="label">eMMC硬件磨损等级</div>
<div class="value" id="emmc_life"></div>
</div>

<div class="card">
<div class="label">预计剩余eMMC</div>
<div class="value" id="remaining_years"></div>
</div>

<div class="card" id="battery_card">
<div class="label">电池状态</div>
<div class="value" id="battery"></div>
</div>

<div class="card">
<div class="label">温度</div>
<div class="value" id="temp"></div>
</div>

<div class="card">
<div class="label">无线 IP</div>
<div class="value" id="wifi_ip"></div>
</div>

<div class="card">
<div class="label">CPU 使用率</div>
<div class="value" id="cpu"></div>
</div>

<div class="card">
<div class="label">内存使用率</div>
<div class="value" id="mem"></div>
</div>

<div class="card">
<div class="label">ZFS ARC 占用</div>
<div class="value" id="arc"></div>
</div>

</div>

<div class="chart-wrap">
<canvas id="chart"></canvas>
</div>

<div class="footer">
Monitoring Dashboard <a href="https://github.com/jarodlee/gpd_mmc_log">github link</a> · Auto refresh every 5s
</div>

<script>

let chart = null;

function initChart() {
    if (!window.Chart) {
        document.getElementById("status").innerText = "Chart.js 未加载，数据卡片仍会自动刷新。";
        return;
    }

    const ctx = document.getElementById('chart').getContext('2d');
    chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [{
                label: 'Daily Written (GB)',
                data: [],
                borderColor: '#2563eb',
                backgroundColor: 'rgba(37,99,235,0.1)',
                fill: true,
                tension: 0.25
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: { ticks: { maxTicksLimit: 8 } },
                y: { beginAtZero: true }
            }
        }
    });
}

function setText(id, value) {
    document.getElementById(id).innerText =
        value === null || value === undefined || value === "" ? "N/A" : value;
}

function setColor(id, value, warn, danger) {
    const el = document.getElementById(id);
    el.classList.remove("ok","warn","danger","muted");
    if (value === null || value === undefined || Number.isNaN(Number(value))) {
        el.classList.add("muted");
    } else if (value >= danger) {
        el.classList.add("danger");
    } else if (value >= warn) {
        el.classList.add("warn");
    } else {
        el.classList.add("ok");
    }
}

function emmcLifeText(level, pre) {
    if (level === null || level === undefined) return "N/A";

    let percentRange = "";
    if (level >= 1 && level <= 10) {
        percentRange = ((level - 1) * 10) + "% - " + (level * 10) + "%";
    } else if (level === 11) {
        percentRange = "超过额定寿命";
    } else {
        percentRange = "未知等级";
    }

    const preMap = {
        1: "正常",
        2: "接近寿命",
        3: "寿命终点"
    };
    const status = preMap[pre] || "未知";

    return "Level " + level + " (" + percentRange + ") · " + status;
}

function formatRemaining(data) {
    if (!data.remaining_estimate_reliable) {
        return data.remaining_estimate_note || "暂无可靠估算";
    }

    const value = data.remaining_years;
    if (value === null || value === undefined) return "暂无可靠估算";
    if (value < 1) return Math.round(value * 365) + " 天";
    return value + " 年";
}

function updateChart(history) {
    if (!chart || !Array.isArray(history)) return;
    chart.data.labels = history.map(x => x.date);
    chart.data.datasets[0].data = history.map(x => x.gb);
    chart.update();
}

function loadData() {
    fetch('/mmc_data', { cache: 'no-store' })
        .then(res => {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.json();
        })
        .then(data => {
            const diskParts = [
                data.disk_name,
                data.disk_model,
                data.disk_size_gb !== null && data.disk_size_gb !== undefined ? data.disk_size_gb + " GB" : null
            ].filter(Boolean);

            setText("disk_info", diskParts.length ? diskParts.join(" · ") : "N/A");
            setText("total_tb", data.total_tb + " TB");
            setText("today_gb", data.today_gb + " GB");
            setText("avg_daily_gb", data.avg_daily_gb + " GB");
            setText("life_percent", data.life_used_percent + " %");
            setText("remaining_years", formatRemaining(data));

            setText("battery",
                data.battery_percent !== null && data.battery_percent !== undefined ?
                data.battery_percent + "% (" + data.battery_status + ")" : "N/A");

            setText("temp",
                data.temperature_c !== null && data.temperature_c !== undefined ?
                data.temperature_c + " °C" : "N/A");

            setText("wifi_ip", data.wifi_ip || "N/A");
            setText("cpu",
                data.cpu_usage !== null && data.cpu_usage !== undefined ?
                data.cpu_usage + " %" : "N/A");
            setText("mem",
                data.mem_used_percent !== null && data.mem_used_percent !== undefined ?
                data.mem_used_percent + " %" : "N/A");
            setText("arc",
                data.arc_size_gb !== null && data.arc_size_gb !== undefined ?
                data.arc_size_gb + " GB" : "N/A");

            setText("emmc_life", emmcLifeText(data.emmc_life_level, data.emmc_pre_eol));

            setColor("temp", data.temperature_c, 50, 60);
            setColor("mem", data.mem_used_percent, 70, 80);
            setColor("arc", data.arc_size_gb, 2.5, 3);
            setColor("today_gb", data.today_gb, 20, 30);
            setColor("life_percent", data.life_used_percent, 70, 90);

            updateChart(data.history);
            document.getElementById("status").innerText = "最后更新：" + new Date().toLocaleString();
        })
        .catch(err => {
            document.getElementById("status").innerText = "读取 /mmc_data 失败：" + err.message;
        });
}

initChart();
loadData();
setInterval(loadData, 5000);

</script>

</body>
</html>
